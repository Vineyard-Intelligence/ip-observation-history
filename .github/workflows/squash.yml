name: squash

# Keeps roughly one month of commit history. Everything older is folded into a single baseline commit
# whose tree is identical to the commit it replaces, so no data is lost — only the older history.
#
# Runs monthly and by hand. The script verifies the tree is unchanged before it rewrites anything.
on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:
    inputs:
      days:
        description: "history window to keep, in days"
        default: "30"

permissions:
  contents: write

# Same group as collect.yml: a force-push while a collection is committing would make one of them fail.
concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  squash:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Squash history
        run: bash scripts/squash-history.sh --days "${{ github.event.inputs.days || 30 }}"

      - name: Push
        run: git push --force-with-lease origin "HEAD:${{ github.ref_name }}"
